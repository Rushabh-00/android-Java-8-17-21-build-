name: Build Server JRE 8 for Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
   contents: write

jobs:
  build_android:
    strategy:
      matrix:
        # UPDATED: We only build for ARM architectures now.
        arch: [ "aarch32", "aarch64" ]
      fail-fast: false

    name: "Build for Android ${{matrix.arch}}"
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: 8
        distribution: zulu
    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt -y install autoconf python3 python-is-python3 unzip zip systemtap-sdt-dev gcc-multilib g++-multilib libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev
    - name: Build with CI build script
      run: bash "ci_build_arch_${{matrix.arch}}.sh"
    - name: Upload JRE build output
      uses: actions/upload-artifact@v4
      with:
        name: 'jre8-${{matrix.arch}}'
        path: jre8*.tar.xz

  # DELETED: The entire 'pojav' job that created the zip file is gone.
  # NEW: A dedicated job to create the release.
  release:
    needs: build_android
    runs-on: ubuntu-22.04
    steps:
    - name: Download all JRE artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: Rename and prepare artifacts
      run: |
        mkdir release-assets
        find artifacts/jre8-aarch32 -name "*.tar.xz" -exec mv {} release-assets/8-arm32.tar.xz \;
        find artifacts/jre8-aarch64 -name "*.tar.xz" -exec mv {} release-assets/8-arm64.tar.xz \;
        echo "Prepared release assets:"
        ls -l release-assets

    - name: Upload to GitHub Release
      uses: svenstaro/upload-release-action@v2
      # Only run on a push to the buildjre8 branch in your repository
      if: github.ref_name == 'buildjre8'
      with:
          # Use a wildcard to upload all renamed .tar.xz files
          file: release-assets/*.tar.xz
          tag: rolling-jre8-17-21 # Use a specific tag for this release
          overwrite: true
          file_glob: true
