name: Build Server JRE 17 & 21 for Android

on:
  push:
  workflow_dispatch:

permissions:
   contents: write

jobs:
  build_android:
    strategy:
      matrix:
        # UPDATED: We only build for ARM architectures now.
        arch: ["aarch32", "aarch64"]
        version: [17, 21]
      fail-fast: false

    name: "Build Java ${{ matrix.version }} for Android ${{matrix.arch}}"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.version }}
          distribution: temurin
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt -y install autoconf python3 python-is-python3 unzip zip systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxtst-dev libxt-dev
      - name: Build with CI build script
        run: export TARGET_VERSION=${{ matrix.version }} && bash "1_ci_build_arch_${{matrix.arch}}.sh"
      - name: Upload JRE build output
        uses: actions/upload-artifact@v4
        with:
          name: "jre${{ matrix.version }}-${{matrix.arch}}"
          path: jre${{ matrix.version }}*.tar.xz

  # DELETED: The entire 'pojav' job that created the zip files is gone.
  # NEW: A dedicated job to create the release for both versions.
  release:
    needs: build_android
    runs-on: ubuntu-22.04
    steps:
      - name: Download all JRE artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename and prepare artifacts
        run: |
          mkdir release-assets
          # Rename Java 17 files
          find artifacts/jre17-aarch32 -name "*.tar.xz" -exec mv {} release-assets/17-arm32.tar.xz \;
          find artifacts/jre17-aarch64 -name "*.tar.xz" -exec mv {} release-assets/17-arm64.tar.xz \;
          # Rename Java 21 files
          find artifacts/jre21-aarch32 -name "*.tar.xz" -exec mv {} release-assets/21-arm32.tar.xz \;
          find artifacts/jre21-aarch64 -name "*.tar.xz" -exec mv {} release-assets/21-arm64.tar.xz \;
          echo "Prepared release assets:"
          ls -l release-assets
      
      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@v2
        # Only run on a push to the buildjre17-21 branch in your repository
        if: github.ref_name == 'buildjre17-21'
        with:
          # Use a wildcard to upload all renamed .tar.xz files
          file: release-assets/*.tar.xz
          tag: rolling-jre8-17-21 # Use a specific tag for this release
          overwrite: true
          file_glob: true
